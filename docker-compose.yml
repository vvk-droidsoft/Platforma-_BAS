services:
  lis:
    build: .
    image: lis-tests:2.1
    container_name: lis-tests
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      MASTER_PASSWORD: "${MASTER_PASSWORD:-admin}"
      # необязательно: явный ключ vault (иначе файл /data/.lis_vault_key).
      # Не привязан к ADMIN_PASSWORD — смена пароля админа не ломает просмотр паролей учёток.
      LIS_VAULT_KEY: "${LIS_VAULT_KEY:-}"
      LIS_ENV: prod
      DATA_DIR: /data
    volumes:
      - lis-data:/data
      # код с диска сервера: HTML и CSS подхватываются без пересборки образа,
      # правки Python — после перезапуска контейнера
      - ./server:/app/server
      - ./Генератор_тестов.html:/app/Генератор_тестов.html
      - ./Конвертер_тестов.html:/app/Конвертер_тестов.html
      - ./Нормативы.html:/app/Нормативы.html
      - ./Полётная_ведомость.html:/app/Полётная_ведомость.html
      - ./Полигон.html:/app/Полигон.html
    restart: unless-stopped

volumes:
  lis-data:
